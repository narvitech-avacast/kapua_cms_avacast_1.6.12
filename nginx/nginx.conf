events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 20M;

    log_format kapua '$remote_addr [$time_local] port=$server_port "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';
    access_log /var/log/nginx/access.log kapua;
    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate     /etc/nginx/certs/localhost+3.pem;
    ssl_certificate_key /etc/nginx/certs/localhost+3-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    server {
        listen 443 ssl;
        server_name localhost cms.test 172.16.19.37;

        rewrite ^/api/v1/(.*)$ /v1/$1 last;

        location /sso/ {
            set $api_backend "debug-proxy:7080";
            proxy_pass         http://$api_backend;
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }

        location /v1/ {
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin' $http_origin;
                add_header 'Access-Control-Allow-Credentials' 'true';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'X-Requested-With, Content-Type, Authorization, X-File-Name, Accept';
                return 204;
            }
            set $api_backend "debug-proxy:7080";
            proxy_pass         http://$api_backend;
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }

        location /mqtt-presence {
            set $api_backend "debug-proxy:7080";
            proxy_pass         http://$api_backend;
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }

        location /devicesNoAuth/ {
            proxy_pass         http://debug-proxy:7080/v1/devicesNoAuth/;
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }

        location /doc {
            return 301 https://$host:8443/doc/;
        }

        location /signage-media/ {
            alias /var/lib/kapua-signage/;
            try_files $uri =404;
            autoindex off;
            limit_except GET HEAD { deny all; }
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location / {
            proxy_pass         http://kapua-console:8080;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }
    }

    server {
        listen 8443 ssl;
        server_name localhost;

        rewrite ^/api/v1/(.*)$ /v1/$1 last;

        location / {
            set $api_backend "debug-proxy:7080";
            proxy_pass         http://$api_backend;
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }
    }

    server {
        listen 80;

        rewrite ^/api/v1/(.*)$ /v1/$1 last;

        location / {
            set $api_backend "debug-proxy:7080";
            proxy_pass         http://$api_backend;
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto http;
        }
    }

    # Port 8080 – legacy SIGNAGE-V1 Android players hard-code
    # http://{host}:8080/api/v1/{scopeId}/file-repo/{id}/get-image
    # for their pre-download step.  Only that path is exposed; everything
    # else returns 404 so this port cannot be used as a general API bypass.
    server {
        listen 8080;
        server_name localhost cms.test 172.16.19.37;

        location ~ ^/api/v1/[^/]+/file-repo/ {
            rewrite ^/api/v1/(.*)$ /v1/$1 break;
            proxy_pass         http://kapua-api:8080;
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto http;
        }

        location / {
            return 404;
        }
    }
}
