events {
    worker_connections 1024;
}

http {
    log_format kapua '$remote_addr [$time_local] port=$server_port "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';
    access_log /var/log/nginx/access.log kapua;
    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate     /etc/nginx/certs/localhost+2.pem;
    ssl_certificate_key /etc/nginx/certs/localhost+2-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    server {
        listen 443 ssl;
        server_name localhost cms.test;

        rewrite ^/api/v1/(.*)$ /v1/$1 last;

        location /sso/ {
            set $api_backend "debug-proxy:7080";
            proxy_pass         http://$api_backend;
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }

        location /v1/ {
            set $api_backend "debug-proxy:7080";
            proxy_pass         http://$api_backend;
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }

        location / {
            proxy_pass         http://kapua-console:8080;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }
    }

    server {
        listen 8443 ssl;
        server_name localhost;

        rewrite ^/api/v1/(.*)$ /v1/$1 last;

        location / {
            set $api_backend "debug-proxy:7080";
            proxy_pass         http://$api_backend;
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }
    }

    server {
        listen 80;

        rewrite ^/api/v1/(.*)$ /v1/$1 last;

        location / {
            set $api_backend "debug-proxy:7080";
            proxy_pass         http://$api_backend;
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto http;
        }
    }
}
