services:
  db:
    ports:
      - "3307:3306"

  kapua-api:
    volumes:
      - d:/Kapua_cms_bill_1.6.12/jetty/http-forwarded.ini:/var/opt/jetty/start.d/http-forwarded.ini:ro

  nginx:
    container_name: nginx
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    volumes:
      - d:/Kapua_cms_bill_1.6.12/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - d:/Kapua_cms_bill_1.6.12/nginx/certs:/etc/nginx/certs:ro
      - d:/Kapua_cms_bill_1.6.12/nginx/logs:/var/log/nginx
    depends_on:
      - kapua-console
      - kapua-api
      - debug-proxy

  debug-proxy:
    container_name: debug-proxy
    build: d:/Kapua_cms_bill_1.6.12/debug-proxy
    ports:
      - "9999:9999"
      - "8081:8081"
      - "8082:8082"
      - "8444:8444"
    environment:
      - PROBE_PORTS=8081,8082,8444
    restart: unless-stopped
