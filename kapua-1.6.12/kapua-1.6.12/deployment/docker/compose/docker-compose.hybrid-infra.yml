# Kapua 混合開發模式 - 僅基礎設施
# DB 端口改為 3307 (避免與本地 MySQL 3306 衝突)
# broker 開放內部 MQTT 端口 1893 供本地服務連線
services:
  db:
    container_name: db
    image: kapua/kapua-sql:${IMAGE_VERSION:-latest}
    ports:
      - "${KAPUA_DB_PORT:-3307}:3306"
      - "${KAPUA_DB_WEB_PORT:-8181}:8181"
    environment:
      - H2_WEB_OPTS=-web -webAllowOthers -webPort 8181

  es:
    container_name: es
    image: docker.elastic.co/elasticsearch/elasticsearch:7.8.1
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - cluster.name=kapua-datastore
      - discovery.type=single-node
      - transport.host=_site_
      - transport.ping_schedule=-1
      - transport.tcp.connect_timeout=30s

  events-broker:
    container_name: events-broker
    image: kapua/kapua-events-broker:${IMAGE_VERSION:-latest}
    ports:
      - "5672:5672"

  broker:
    container_name: broker
    image: kapua/kapua-broker:${IMAGE_VERSION:-latest}
    ports:
      - "1883:1883"
      - "8883:8883"
      - "61614:61614"
      - "${KAPUA_BROKER_INTERNAL_PORT:-1893}:1893"
    depends_on:
      - db
      - es
      - events-broker
    environment:
      - CRYPTO_SECRET_KEY=${CRYPTO_SECRET_KEY:-dockerSecretKey!}
      - KAPUA_DISABLE_SSL
      - KAPUA_DISABLE_DATASTORE
      - LOGBACK_LOG_LEVEL
